---
- name: Include nix-default role
  include_role:
    name: utils/nix-default

- name: Install basic applications
  apt:
    name:
    - firefox
    - python3
    - python3-pip
    - pipx
    - p7zip-full
    - nmap
    state: present
    update_cache: yes

- name: Install common desktop packages
  become: true
  apt:
    name:
    - ubuntu-mate-core
  when: desktop is defined

- name: Update java alternatives
  command: update-java-alternatives -s java-1.11.0-openjdk-amd64

- name: Install vscode via deb
  apt:
    deb: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
    state: present

- name: Install impacket
  community.general.pipx:
    name: impacket
    state: present

- name: Install netexec
  community.general.pipx:
    name: netexec
    source: git+https://github.com/Pennyw0rth/NetExec
    state: present

- name: Download microsoft pgp key
  get_url:
    url: https://packages.microsoft.com/config/ubuntu/{{ ansible_distribution_version }}/packages-microsoft-prod.deb
    dest: /tmp/packages-microsoft-prod.deb

- name: Add microsoft pgp key
  shell: dpkg -i /tmp/packages-microsoft-prod.deb

- name: Install Powershell 7
  apt:
    name: powershell
    update_cache: yes

- name: Setup powershell to use wsman
  shell: |
    pwsh -Command 'Install-Module -Name PSWSMan -Force'
    pwsh -Command 'Install-WSMan'

- name: Add Kali repository
  apt:
    deb: https://http.kali.org/pool/main/k/kali-archive-keyring/kali-archive-keyring_2024.1_all.deb
    state: present
    update_cache: yes

- name: Add priority to kali repository
  copy:
    dest: /etc/apt/preferences.d/kali
    content: |
      Package: *
      Pin: release a=kali
      Pin-Priority: 50

- name: Create directory for operator toolkit
  file:
    path: /opt/operator-kit/tools
    state: directory

- name: Read operators toolkit tools list
  set_fact:
    tools: "{{ lookup('file', 'nix-tools.txt').split('\n') }}"

- name: Clone operator toolkit
  git:
    repo: "{{ item }}"
    dest: /opt/operator-kit/tools/
  loop: "{{ tools }}" 