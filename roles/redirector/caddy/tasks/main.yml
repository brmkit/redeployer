---
- name: Include nix-default role
  include_role:
    name: utils/nix-default

- name: Adding Caddy GPG key
  apt_key:
    url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
    state: present

- name: Adding Caddy repository
  apt_repository:
    repo: "deb https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    state: present
    update_cache: true

- name: Installing caddy
  apt:
    name: caddy
    state: latest

- name: Create caddy config
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: caddy
    group: caddy
    mode: '0644'

- name: Try to format Caddyfile
  command: caddy fmt --overwrite /etc/caddy/Caddyfile
  become: true

- name: Start caddy
  systemd:
    name: caddy
    state: started
    enabled: yes
    daemon_reload: yes