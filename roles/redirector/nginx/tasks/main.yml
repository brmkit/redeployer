--- 
- name: Include nix-default role
  include_role:
    name: utils/nix-default

- name: Install nginx
  apt:
    name: nginx
    state: latest
    update_cache: true

- name: Start nginx
  service: 
    name: nginx
    state: started
    enabled: yes

- name: Create nginx config 
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default

- name: Restart nginx
  service:
    name: nginx
    state: restarted
