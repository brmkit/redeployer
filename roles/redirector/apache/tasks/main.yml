---
- name: Include nix-default role
  include_role:
    name: utils/nix-default

- name: Install apache2
  apt:
    name: apache2
    state: latest
    update_cache: true

- name: Start apache2
  service:
    name: apache2
    state: started
    enabled: yes

- name: Create apache2 config
  template:
    src: apache2.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf

- name: Enable apache2 rewrite module
  apache2_module:
    name: rewrite
    state: present

- name: Restart apache2
  service:
    name: apache2
    state: restarted